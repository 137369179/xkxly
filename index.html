<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#FFF6FA" />
    <!-- P0-LCP：首屏 Hero 图片预加载必须排在 <head> 最前，确保浏览器预加载扫描器
         第一时间发现 LCP 资源并开始下载，不受后续 OG/结构化数据/字体 preload 阻塞 -->
    <link rel="preload" as="image" href="/hero_jelly.jpg" fetchpriority="high" />
    <!-- 字体预加载：避免 FOIT，字体与 JS 并行下载 -->
    <link rel="preload" as="font" href="/fonts/baloo-2.woff2" type="font/woff2" crossorigin />
    <meta name="description" content="宝贝学习乐园 —— AI 儿童成长学习乐园：字母、古诗、数学、汉字、英语、逻辑、闯关冒险，还有 AI 小老师陪孩子聊天、出题、讲故事。让学习变成一场有趣的冒险。" />
    <meta name="keywords" content="儿童学习,幼儿启蒙,AI儿童,数学启蒙,拼音,古诗,英语单词,逻辑思维,宝贝学习乐园" />
    <link rel="canonical" href="https://xkxly.ccwu.cc/" />

    <!-- Open Graph / 社交分享 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="宝贝学习乐园" />
    <meta property="og:title" content="宝贝学习乐园 · AI 儿童成长学习乐园" />
    <meta property="og:description" content="AI 陪伴孩子探索知识：字母、古诗、数学、汉字、英语、逻辑、闯关冒险，还有 AI 小老师陪聊、出题、讲故事。" />
    <meta property="og:url" content="https://xkxly.ccwu.cc/" />
    <meta property="og:image" content="https://xkxly.ccwu.cc/hero_banner.jpg" />
    <meta property="og:locale" content="zh_CN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="宝贝学习乐园 · AI 儿童成长学习乐园" />
    <meta name="twitter:description" content="AI 陪伴孩子探索知识，让学习变成一场有趣的冒险。" />
    <meta name="twitter:image" content="https://xkxly.ccwu.cc/hero_banner.jpg" />

    <!-- 结构化数据（Schema.org）：帮助搜索引擎理解产品 -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "宝贝学习乐园",
      "alternateName": "Baby Learning Park",
      "url": "https://xkxly.ccwu.cc/",
      "description": "AI 儿童成长学习乐园，涵盖字母、古诗、数学、汉字、英语、逻辑等，并提供 AI 小老师陪伴学习。",
      "inLanguage": "zh-CN",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://xkxly.ccwu.cc/#/home",
        "query-input": "required name=search_term"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "宝贝学习乐园",
      "url": "https://xkxly.ccwu.cc/",
      "description": "面向 3-12 岁儿童的 AI 学习与成长平台。",
      "audience": {
        "@type": "EducationalAudience",
        "educationalRole": "student",
        "audienceType": "儿童"
      }
    }
    </script>

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icons/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>宝贝学习乐园 · AI 儿童成长学习乐园</title>
  </head>
  <body>
    <div id="root">
    <!-- P0-LCP：静态 Hero 图片使浏览器在 JS 加载前即可发现 LCP 候选元素，
         React 挂载后自动替换此内容，保证首帧即见 Hero 主视觉 -->
    <img src="/hero_jelly.jpg" alt="" fetchpriority="high" loading="eager" decoding="async"
         style="position:fixed;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 38%" />
    <div style="position:fixed;inset:0;background:linear-gradient(to right,rgba(224,90,128,0.6),rgba(255,107,150,0.3),transparent);pointer-events:none"></div>
  </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
