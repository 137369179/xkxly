    <circle cx="256" cy="272" r="152" fill="#ff8db0" />
    <!-- 眼睛 -->
    <circle cx="206" cy="256" r="17" fill="#FFFFFF" />
    <circle cx="306" cy="256" r="17" fill="#FFFFFF" />
    <!-- 腮红 -->
    <circle cx="172" cy="300" r="21" fill="#ff6b96" opacity="0.55" />
    <circle cx="340" cy="300" r="21" fill="#ff6b96" opacity="0.55" />
